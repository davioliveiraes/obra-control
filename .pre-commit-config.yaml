repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        exclude: ^docker-compose\.dev\.yml$
      - id: check-yaml
        name: check yaml (Compose extensions)
        files: ^docker-compose\.dev\.yml$
        # Parse Compose tags without constructing them. Validate the combined
        # Compose model separately with scripts/compose-dev.ps1 config --quiet.
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: trailing-whitespace
